[project]
site_name = "enstow"
site_description = "A high-performance, single-binary CLI secret-aware dotfile manager combining GNU stow symlinking with sops and age decryption"
site_author = "Nicholas Wilde"
site_url = "https://nicholaswilde.io/enstow"
copyright = "Copyright &copy; 2026 Nicholas Wilde"
repo_url = "https://github.com/nicholaswilde/enstow"
repo_name = "nicholaswilde/enstow"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "About" = "about.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Configuration" = "configuration.md" },
  { "Secrets & Templates" = "secrets.md" },
  { "Contributing" = "CONTRIBUTING.md" },
  { "Code of Conduct" = "CODE_OF_CONDUCT.md" },
]

[project.theme]
features = [
  "navigation.tracking",
  "navigation.top",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "material/toggle-switch-off-outline", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "material/toggle-switch", name = "Switch to light mode" }

[[project.extra.social]]
icon = "fontawesome/solid/house"
link = "https://nicholaswilde.io/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nicholaswilde"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/nicholascwilde"

[[project.extra.social]]
icon = "fontawesome/brands/instagram"
link = "https://www.instagram.com/wildewoodworking/"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin-in"
link = "https://www.linkedin.com/in/nicholaswilde"

[[project.extra.social]]
icon = "fontawesome/brands/facebook"
link = "https://www.facebook.com/nicholas.wilde/"

[[project.extra.social]]
icon = "fontawesome/brands/keybase"
link = "https://keybase.io/nicholaswilde"

[[project.extra.social]]
icon = "fontawesome/solid/key"
link = "https://github.com/nicholaswilde.gpg"

[project.plugins.search]

[project.plugins.minify]
minify_html = true

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.admonition]

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true
user = "nicholaswilde"
repo = "enstow"
