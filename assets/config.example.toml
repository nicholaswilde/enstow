# enstow example configuration file
# Default location: $XDG_CONFIG_HOME/enstow/config.toml (or ~/.config/enstow/config.toml)
# Formats supported: TOML (.toml), YAML (.yaml, .yml), JSON (.json)

# Default source directory containing dotfile packages (defaults to ".")
# source = "~/dotfiles"

# Default target directory where dotfiles are deployed (defaults to $HOME)
# target = "~"

# Preview actions without writing changes to disk ($ENSTOW_DRY_RUN)
# dry_run = false

# Overwrite existing target files or differing symlinks ($ENSTOW_FORCE)
# force = false

# Backup conflicting target files before overwriting ($ENSTOW_BACKUP or -b / --backup)
# backup = false

# Directory to relocate conflicting target files during backup ($ENSTOW_BACKUP_DIR or --backup-dir, defaults to $target/.enstow-backup)
# backup_dir = "~/.enstow-backup"

# Path to age identity key file for secret decryption and encryption ($ENSTOW_AGE_KEY_FILE or $SOPS_AGE_KEY_FILE)
# age_key_file = "~/.config/sops/age/keys.txt"

# Default age recipient public keys ($ENSTOW_RECIPIENTS or $SOPS_AGE_RECIPIENTS)
# recipients = [
#     "age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p",
# ]

# Default list of packages to manage if none are specified on the CLI ($ENSTOW_PACKAGES)
# packages = [
#     "zsh",
#     "nvim",
#     "git",
# ]

# Default profile to activate if none is specified on the CLI ($ENSTOW_PROFILE or --profile)
# default_profile = "work"

# Profile definitions mapping profile names to lists of packages
# [profiles.work]
# packages = ["common", "git", "zsh", "work"]
#
# [profiles.server]
# packages = ["common", "bash", "server"]

# Preferred editor for `enstow edit` (defaults to $ENSTOW_EDITOR, $VISUAL, $EDITOR, or "nano")
# editor = "nvim"

# Additional ignore patterns ($ENSTOW_IGNORE or -i / --ignore, matched via glob against relative paths)
# ignore = [
#     "*.tmp",
#     ".DS_Store",
#     "*.swp",
# ]

# Output status in JSON format by default ($ENSTOW_JSON or --json)
# json = false

# Mask sensitive secret contents in diff output ($ENSTOW_MASK_SECRETS or --mask-secrets)
# mask_secrets = false

# Target file permissions for decrypted secrets (glob patterns, defaults to "0600")
# [permissions]
# "**/*.sh" = "0755"
# "**/*.key" = "0400"
#
# Per-package permission overrides
# [package.ssh.permissions]
# "id_ed25519" = "0600"

# Bypass lifecycle hook execution ($ENSTOW_NO_HOOKS or --no-hooks)
# no_hooks = false

# Lifecycle hooks for deployment (executed via system shell with contextual environment
# variables: ENSTOW_PACKAGE, ENSTOW_SOURCE, ENSTOW_TARGET, ENSTOW_HOOK_TYPE, ENSTOW_DRY_RUN, ENSTOW_FORCE)
# [hooks]
# pre_apply = "echo 'Starting deployment'"
# post_apply = "echo 'Deployment finished'"
# pre_unstow = "echo 'Starting unstow'"
# post_unstow = "echo 'Unstow finished'"
#
# Per-package lifecycle hooks
# [package.bat.hooks]
# post_apply = "bat cache --build"
