# enstow example configuration file
# Default location: $XDG_CONFIG_HOME/enstow/config.toml (or ~/.config/enstow/config.toml)
# Formats supported: TOML (.toml), YAML (.yaml, .yml), JSON (.json)

# Default source directory containing dotfile packages (defaults to ".")
# source = "~/dotfiles"

# Default target directory where dotfiles are deployed (defaults to $HOME)
# target = "~"

# Preview actions without writing changes to disk ($ENSTOW_DRY_RUN)
# dry_run = false

# Overwrite existing target files or differing symlinks ($ENSTOW_FORCE)
# force = false

# Path to age identity key file for secret decryption and encryption ($ENSTOW_AGE_KEY_FILE or $SOPS_AGE_KEY_FILE)
# age_key_file = "~/.config/sops/age/keys.txt"

# Default age recipient public keys ($ENSTOW_RECIPIENTS or $SOPS_AGE_RECIPIENTS)
# recipients = [
#     "age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p",
# ]

# Default list of packages to manage if none are specified on the CLI ($ENSTOW_PACKAGES)
# packages = [
#     "zsh",
#     "nvim",
#     "git",
# ]

# Preferred editor for `enstow edit` (defaults to $ENSTOW_EDITOR, $VISUAL, $EDITOR, or "nano")
# editor = "nvim"

# Additional ignore patterns ($ENSTOW_IGNORE or -i / --ignore, matched via glob against relative paths)
# ignore = [
#     "*.tmp",
#     ".DS_Store",
#     "*.swp",
# ]

# Output status in JSON format by default ($ENSTOW_JSON or --json)
# json = false

