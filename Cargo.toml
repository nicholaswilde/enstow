[package]
name = "enstow"
version = "0.1.12"
edition = "2021"
authors = ["Nicholas Wilde"]
description = "A secret-aware dotfile manager combining stow symlinking with sops and age decryption"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"
age = { version = "0.12.1", features = ["ssh", "armor"] }
rpassword = "7.3"
zeroize = "1.8"
ignore = "0.4"
globset = "0.4"
tempfile = "3.16"
similar = "3.2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.ci]
inherits = "dev"
incremental = false
debug = 0

[package.metadata.deb]
maintainer = "Nicholas Wilde <ncwilde43@gmail.com>"
copyright = "2026 Nicholas Wilde"
license-file = ["LICENSE", "4"]
extended-description = "A secret-aware dotfile manager combining stow symlinking with sops and age decryption."
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/enstow",
    "usr/bin/",
    "755",
  ],
  [
    "assets/enstow.1",
    "usr/share/man/man1/",
    "644",
  ],
  [
    "completions/enstow.bash",
    "usr/share/bash-completion/completions/enstow",
    "644",
  ],
  [
    "completions/_enstow",
    "usr/share/zsh/vendor-completions/_enstow",
    "644",
  ],
  [
    "completions/enstow.fish",
    "usr/share/fish/vendor_completions.d/enstow.fish",
    "644",
  ],
  [
    "README.md",
    "usr/share/doc/enstow/README.md",
    "644",
  ],
]
